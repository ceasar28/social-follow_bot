<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modeMIND - Token Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #f4f4f9;
        }

        .banner {
            background-image: url('./D60DAA76-D3B5-4662-8D17-739BCBAC6878.png');
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
        }

        .container {
            max-width: 900px;
            margin: -150px auto 50px;
            background: #2c2c2c;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        .logo {
            display: block;
            margin: 0 auto 20px;
            width: 150px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #333;
            color: #fff;
        }

        button {
            padding: 10px 20px;
            background-color: #ffcc00;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            color: #1a1a1a;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e6b800;
        }

        .result,
        .chat-container {
            margin-top: 20px;
            padding: 20px;
            background: #333;
            border-radius: 8px;
        }

        .chat-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .chat-message {
            margin: 5px 0;
        }

        .chat-message.user {
            text-align: right;
            color: #00aaff;
        }

        .chat-message.agent {
            text-align: left;
            color: #7dff7d;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            color: #777;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <!-- Banner Section -->
    <div class="banner">
        <h1>modeMIND - AI meets DeFi</h1>
    </div>

    <!-- Content Container -->
    <div class="container">
        <!-- Logo -->
        <img src="./0A62B9C1-A218-45BA-8E05-BFFD89490F63.png" alt="modeMIND Logo" class="logo">

        <!-- Token Analysis Section -->
        <h3>Token Analysis</h3>
        <p>Enter a token address or ticker name to analyze its on-chain data.</p>
        <input type="text" id="tokenInput" placeholder="Enter token address or ticker name" />
        <button onclick="analyzeToken()">Analyze Token</button>
        <div id="result" class="result"></div>

        <!-- Chat Section -->
        <h3>Chat with modeMIND</h3>
        <div id="chatContainer" class="chat-container"></div>
        <textarea id="chatInput" placeholder="Type your message..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- Footer -->
    <footer>
        Powered by modeMIND | Bringing AI to DeFi
    </footer>

    <script>
        async function analyzeToken() {
            const tokenInput = document.getElementById('tokenInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = ''; // Clear previous results

            if (!tokenInput) {
                resultDiv.innerHTML = '<p style="color: red;">Please enter a token address or ticker name.</p>';
                return;
            }

            try {
                // Replace with your API endpoint
                const response = await fetch(`https://api.yourbackend.com/token-analysis?query=${encodeURIComponent(tokenInput)}`);
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
            <h4>Analysis for: ${data.tokenName} (${data.tokenTicker})</h4>
            <p><strong>On-Chain Data:</strong> ${data.onChainData}</p>
            <p><strong>Projections:</strong> ${data.projections}</p>
            <p><strong>Market Cap:</strong> ${data.marketCap}</p>
            <p><strong>Circulating Supply:</strong> ${data.circulatingSupply}</p>
          `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">${data.error || 'Unable to fetch data.'}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }

        async function sendMessage() {
            const chatInput = document.getElementById('chatInput');
            const chatContainer = document.getElementById('chatContainer');

            const userMessage = chatInput.value.trim();
            if (!userMessage) return;

            // Display user's message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'chat-message user';
            userMsgDiv.textContent = userMessage;
            chatContainer.appendChild(userMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            chatInput.value = ''; // Clear input

            try {
                // Replace with your chatbot API endpoint
                const response = await fetch('https://api.yourbackend.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage }),
                });
                const data = await response.json();

                if (response.ok) {
                    // Display agent's response
                    const agentMsgDiv = document.createElement('div');
                    agentMsgDiv.className = 'chat-message agent';
                    agentMsgDiv.textContent = data.response;
                    chatContainer.appendChild(agentMsgDiv);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    throw new Error(data.error || 'Error getting response.');
                }
            } catch (error) {
                const errorMsgDiv = document.createElement('div');
                errorMsgDiv.className = 'chat-message agent';
                errorMsgDiv.textContent = `Error: ${error.message}`;
                chatContainer.appendChild(errorMsgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }
    </script>
</body>

</html>
